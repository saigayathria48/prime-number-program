apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-number-app
  labels:
    app: prime-number-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prime-number-app
  template:
    metadata:
      labels:
        app: prime-number-app
    spec:
      containers:
        - name: prime-number-app
          image: prime-number-app:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
